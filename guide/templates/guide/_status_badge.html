{% if activity.status == 'published' %}
    <span class="badge badge-published">Veröffentlicht</span>
{% elif activity.status == 'pending' %}
    <span class="badge badge-pending" title="Wird geprüft und erscheint innerhalb von 24 Stunden">Wartet auf Freigabe</span>
{% elif activity.status == 'review' %}
    <span class="badge badge-review" title="Wurde gemeldet und ist ausgeblendet, bis sie geprüft ist">In Prüfung</span>
{% else %}
    <span class="badge badge-draft">Entwurf</span>
{% endif %}
