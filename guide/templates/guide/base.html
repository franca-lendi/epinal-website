{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Épinal Guide{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Eigenes CSS -->
    <link rel="stylesheet" href="{% static 'guide/style.css' %}">
</head>

<body>

    <!-- Obere Zeile (verschwindet beim Scrollen) -->
    <div class="top-bar">
        <p class="tagline">Der Aktivitäten-Guide für Épinal,<br>von Jugendlichen für Jugendliche.</p>
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'guide/logo.png' %}" alt="Titel"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            <span style="display:none;">Titel1</span>
        </a>
        <div class="top-links">
            <a href="#">Über mich</a>
            <a href="#">Kontakt</a>
        </div>
    </div>

    <!-- Navigation (bleibt oben kleben) -->
    <nav class="main-nav">
        <div class="nav-left">
            <a href="{% url 'activities' %}" class="{% if request.resolver_match.url_name == 'activities' %}active{% endif %}">Aktivitäten</a>
            <a href="{% url 'favorites' %}" class="{% if request.resolver_match.url_name == 'favorites' %}active{% endif %}">Favoriten</a>
            <a href="#">Deine Uploads</a>
            <a href="{% url 'add_activity' %}" class="add-btn">+ Hinzufügen</a>
        </div>
        <div class="nav-right">
            <button class="language-button">DE / FR</button>
            <a href="#" class="profile-link">Profil</a>
        </div>
    </nav>

    <!-- Inhalt der jeweiligen Seite -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
